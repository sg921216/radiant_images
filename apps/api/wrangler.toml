name = "radiant-images-api"
main = "src/index.ts"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
[images]
binding = "IMAGES"
[[durable_objects.bindings]]
name = "JPEG_VALIDATOR"
class_name = "JpegValidator"
[[durable_objects.bindings]]
name = "GALLERY_MUTATIONS"
class_name = "GalleryMutations"
[[durable_objects.bindings]]
name = "SCHEDULED_OPERATIONS"
class_name = "ScheduledOperations"
[[migrations]]
tag = "jpeg-validator-v1"
new_sqlite_classes = ["JpegValidator"]
[[migrations]]
tag = "gallery-mutations-v1"
new_sqlite_classes = ["GalleryMutations"]
[[migrations]]
tag = "scheduled-operations-v1"
new_sqlite_classes = ["ScheduledOperations"]
[vars]
WEB_ORIGIN = "http://127.0.0.1:5173"
API_ORIGIN = "http://127.0.0.1:8787"
[[d1_databases]]
binding = "DB"
database_name = "radiant-images-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "src/db/migrations"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "radiant-images-local-media"
[[r2_buckets]]
binding = "RECOVERY"
bucket_name = "radiant-images-local-recovery"
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]
[observability]
enabled = false
