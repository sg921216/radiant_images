name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '12.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm security:dependencies
      - run: pnpm security:secrets
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:setup
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Main branch Chromium smoke
        if: github.event_name == 'push'
        run: pnpm e2e:smoke
      - name: Pull request, nightly and release browser matrix
        if: github.event_name != 'push'
        run: pnpm e2e
      - name: Verify diagnostic privacy
        id: diagnostic_privacy
        if: always()
        run: pnpm security:artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.diagnostic_privacy.outcome == 'success'
        with:
          name: synthetic-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
