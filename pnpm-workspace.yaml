packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261114.1'
  - '@playwright/test@1.65.1'
  - jsdom@31.0.1
  - miniflare@5.20261113.0-beta
  - playwright-core@1.65.1
  - playwright@1.65.1
  - wrangler@4.162.0
  - '@cloudflare/vitest-plugin@1.8.2'
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0

saveExact: true
strictPeerDependencies: true
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@typescript-eslint/typescript-estree>minimatch': 11.0.8
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
