  # ───────────── Admin: gallery ─────────────
  /admin/gallery:
    get:
      tags: [ admin-gallery ]
      security: [ { ownerSession: [] } ]
      responses:
        '200':
          {
            "description": "OK",
            "content":
              {
                "application/json":
                  {
                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/GalleryImage" } }
                  }
              }
          }
        '401': { "$ref": "#/components/responses/Unauthorized" }
        '403': { "$ref": "#/components/responses/Forbidden" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
    post:
      tags: [ admin-gallery ]
      security: [ { ownerSession: [] } ]
      summary: Upload private original and browser-prepared variants for server
        validation — multipart
      description: |
        Original bytes are required for authoritative validation and private recovery.
        MIME, byte counts, dimensions, full decoding and safe derivative metadata are verified
        server-side; client assertions are not trusted. Reject mismatched claims, malformed or
        animated input. Preserve visual orientation and strip GPS/unnecessary public metadata.
        Original dimensions must be 1–16384 per axis and at most 40000000 total pixels.
        Variant long edges must be at most 2000/800/320 pixels, each axis at least 1.
        No original or staged object is public. Commit publication only after all validated
        objects exist; failed writes require cleanup/reconciliation with no partial publication.
        Byte ceilings are enforced while reading, regardless of Content-Length. Oversized
        requests return 413; invalid content/dimensions/claims return 400 with field errors.
        T001's bounded decoder feasibility proof is still required before implementation.
        Header inspection alone does not establish full decoding. Flattening an animation
        is not rejection of animated input. Provider failure must never publish unvalidated
        bytes or fall back to exposing the private original. See research R-16's follow-up;
        local development is owner-approved, but no image-provider subscription is approved.
      x-upload-limits:
        requestBytes: 16777216
        originalBytes: 10485760
        originalMaxAxis: 16384
        originalMaxPixels: 40000000
        fullBytes: 2097152
        cardBytes: 1048576
        thumbBytes: 262144
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [
                  tag,
                  altText,
                  original,
                  full,
                  card,
                  thumb,
                  width,
                  height,
                  originalMime,
                  originalBytes
                ]
              properties:
                tag: { $ref: '#/components/schemas/GalleryTag' }
                altText:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 200,
                    pattern: '\S',
                    description: 'Required descriptive alternative; trim before validation/storage.'
                  }
                original:
                  {
                    type: string,
                    format: binary,
                    description: 'Actual JPEG/PNG/WebP source, 1–10485760 bytes; private storage
                      only. Dimensions and full content are independently
                      checked.'
                  }
                full:
                  {
                    type: string,
                    format: binary,
                    description: 'Static metadata-clean WebP, long edge ≤ 2000px, 1–2097152 bytes.'
                  }
                card:
                  {
                    type: string,
                    format: binary,
                    description: 'Static metadata-clean WebP, long edge ≤ 800px, 1–1048576 bytes.'
                  }
                thumb:
                  {
                    type: string,
                    format: binary,
                    description: 'Static metadata-clean WebP, long edge ≤ 320px, 1–262144 bytes.'
                  }
                width:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 2000,
                    description: 'Claimed full-variant width; must match decoded content.'
                  }
                height:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 2000,
                    description: 'Claimed full-variant height; must match decoded content.'
                  }
                originalMime: { type: string, enum: [ image/jpeg, image/png, image/webp ] }
                originalBytes:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 10485760,
                    description: 'Claim must equal actual original byte length.'
                  }
      responses:
        '201':
          {
            "description": "Created",
            "content":
              {
                "application/json": { "schema": { "$ref": "#/components/schemas/GalleryImage" } }
              }
          }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '413':
          $ref: "#/components/responses/PayloadTooLarge"
        '401': { "$ref": "#/components/responses/Unauthorized" }
        '403': { "$ref": "#/components/responses/Forbidden" }
        '409': { "$ref": "#/components/responses/Conflict" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
