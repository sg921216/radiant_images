  /questionnaire/{token}:
    parameters:
      [
        {
            name: token,
            in: path,
            required: true,
            schema: { type: string, minLength: 32 }
          }
      ]
    get:
      tags: [ questionnaire ]
      summary: Load questionnaire for a client link (no other client data exposed)
      responses:
        '200':
          {
            "description": "OK",
            "content":
              {
                "application/json": { "schema": { "$ref": "#/components/schemas/QuestionnairePublic" } }
              }
          }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '404': { "$ref": "#/components/responses/NotFound" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
    post:
      tags: [ questionnaire ]
      summary: Submit answers (single-use; rejected if submitted or expired)
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [ answers ],
                      properties: { answers: { type: object, additionalProperties: true } }
                    }
                }
            }
        }
      responses:
        '201': { "description": "Recorded" }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '404': { "$ref": "#/components/responses/NotFound" }
        '409': { "$ref": "#/components/responses/Conflict" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
