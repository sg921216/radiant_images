              schema:
                oneOf:
                  - $ref: "#/components/schemas/EmailHistoryFailedError"
                  - allOf:
                      - $ref: "#/components/schemas/Error"
                      - properties:
                          error:
                            properties:
                              code:
                                not:
                                  const: email_history_failed
        '502': { "$ref": "#/components/responses/EmailNotSent" }
        '504': { "$ref": "#/components/responses/EmailOutcomeUnknown" }
        "503":
          $ref: "#/components/responses/Maintenance"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

