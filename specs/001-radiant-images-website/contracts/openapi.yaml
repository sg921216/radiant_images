        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
    put:
      tags: [ admin-clients ]
      security: [ { ownerSession: [] } ]
      summary: Full ordered replacement; existing ids keep per-client state
      description: >-
        Atomically apply the updated master to all retained clients. Added items
        receive incomplete per-client state (completedAt null); retained item
        IDs preserve each client's completion state through renaming,
        reordering, and repeated saves. Removed items and their per-client state
        are deleted. Repeated saves never duplicate state or reset progress, and
        a failed save leaves the master and all per-client state unchanged. New
        clients receive every current master item as incomplete.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
                }
            }
        }
      responses:
        '200': { "description": "OK" }
