openapi: 3.1.0
info:
  title: Radiant Images API
  version: 0.2.0
  description: |
    Cloudflare Worker API consumed by the Radiant Images SPA (Cloudflare Workers Static Assets, separate frontend origin).
    Public endpoints are anonymous. Admin endpoints require `Authorization: Bearer <session token>`
    issued to an allow-listed Google account. All request/response bodies are JSON unless noted.
    Error shape everywhere: `{ "error": { "code": string, "message": string, "fields"?: { [name]: string } } }`.
    Frontend hosting is owner-approved; T001 technical feasibility remains open (research R-16). This contract is not implementation evidence.
servers:
  - url: https://radiant-images-api.<account>.workers.dev
    description: production
  - url: http://localhost:8787
    description: wrangler dev

tags:
  - name: public
  - name: inquiry
  - name: auth
  - name: admin-gallery
  - name: admin-banners
  - name: admin-pricing
  - name: admin-content
  - name: admin-config
  - name: admin-clients
  - name: questionnaire

components:
  securitySchemes:
    ownerSession:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
  responses:
    BadRequest:
      description: Validation failed; `fields` maps field name to message.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing/expired session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not on owner allow-list.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Requested resource was not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Application fixed-window rate limit exceeded (see research
        R-09/R-16). Seconds until the active window resets; does not authorize
        retrying an uncertain email send.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: Upload body or binary part exceeds its byte ceiling; published
        gallery remains unchanged.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Invariant violated (e.g. gallery cap, duplicate inquiry,
        questionnaire already submitted).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadGateway:
      description: Upstream dependency failed before email dispatch. Never use this
        response for an uncertain or accepted send; follow the
        operation-specific recovery guidance.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Internal operation failed. Do not infer that repeating a
        side-effecting request is safe; verify its outcome first.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    EmailNotSent:
      description: Definite non-delivery (provider rejected the send or failure
        occurred before dispatch). Preserve the draft; an explicit user retry is
        allowed. No automatic resend.
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/EmailNotSentError' } }
        }
    EmailOutcomeUnknown:
      description: Dispatch may have reached the provider but acceptance cannot be
        confirmed. Preserve the draft and any possibly delivered invitation;
        manual mailbox/owner verification is required before an explicit new
        send. No immediate or automatic retry.
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/EmailOutcomeUnknownError' } }
        }
    EmailHistoryFailed:
      description: Provider acceptance is confirmed but recording owner send history
        failed. Report acceptance and the recording failure separately; require
        manual reconciliation and never resend to repair history.
      content:
        {
          application/json: { schema: { $ref: '#/components/schemas/EmailHistoryFailedError' } }
        }
    Maintenance:
      description: Offline recovery is in progress. Access resumes only after verified
        reconciliation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message ]
          properties:
            code:
              {
                type: string,
                examples:
                  [
                    validation_failed,
                    captcha_failed,
                    duplicate,
                    gallery_full,
                    stale_option,
                    email_failed,
                    forbidden
                  ]
              }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            retryable:
              {
                type: boolean,
                description: 'Whether an explicit user retry is permitted after recovery; never
                  authorizes automatic email resend. Absence does not establish
                  retry safety.'
              }

    EmailNotSentError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              required: [ retryable ]
              properties:
                code: { const: email_not_sent }
                retryable: { const: true }
    EmailOutcomeUnknownError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              required: [ retryable ]
              properties:
                code: { const: email_outcome_unknown }
                retryable: { const: false }
    EmailHistoryFailedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              required: [ retryable ]
              properties:
                code: { const: email_history_failed }
                retryable: { const: false }

    ShootType: { type: string, enum: [ maternity, newborn, family ] }
    GalleryTag: { type: string, enum: [ maternity, newborn, family, general ] }

    GalleryImage:
      type: object
      required: [ id, tag, altText, sortOrder, width, height, urls ]
      properties:
        id: { type: string }
        tag: { $ref: '#/components/schemas/GalleryTag' }
        altText:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            pattern: '\S',
            description: 'Required descriptive alternative for an informative portfolio
              photograph; trim before validation/storage.'
          }
        sortOrder: { type: integer }
        width: { type: integer, minimum: 1, maximum: 2000 }
        height: { type: integer, minimum: 1, maximum: 2000 }
        urls:
          type: object
          required: [ full, card, thumb ]
          properties:
            full: { type: string, format: uri }
            card: { type: string, format: uri }
            thumb: { type: string, format: uri }

    Banner:
      type: object
      required: [ id, message, linkUrl, startsAt, endsAt ]
      properties:
        id: { type: string }
        message: { type: string, minLength: 1, maxLength: 200 }
        linkUrl: { type: [ string, 'null' ], format: uri }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    BannerInput:
      type: object
      required: [ message, startsAt, endsAt ]
      properties:
        message: { type: string, minLength: 1, maxLength: 200 }
        linkUrl: { type: [ string, 'null' ], format: uri }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    Package:
      type: object
      required: [ id, shootType, sortOrder, name, priceCents, description, inclusions ]
      properties:
        id: { type: string }
        shootType: { $ref: '#/components/schemas/ShootType' }
        sortOrder: { type: integer }
        name: { type: string, minLength: 1, maxLength: 60 }
        priceCents: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 500 }
        inclusions:
          {
            type: array,
            minItems: 1,
            maxItems: 15,
            items: { type: string, maxLength: 120 }
          }
    PricingRevision:
      type: object
      required: [ revisionId, publishedAt, packages ]
      properties:
        revisionId: { type: string }
        publishedAt: { type: string, format: date-time }
        packages: { type: array, items: { $ref: '#/components/schemas/Package' } }
    PricingDraftInput:
      type: object
      required: [ packages ]
      description: Full replacement; must include ≥1 package per shoot type.
      properties:
        packages:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Package'
              - type: object
                properties: { id: { type: string, description: 'ignored on publish' } }

    HowItWorksStep:
      type: object
      required: [ title, body ]
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 600 }
    PageContent:
      type: object
      required: [ page, introMd, howItWorks ]
      properties:
        page: { type: string, enum: [ about, maternity, newborn, family ] }
        introMd: { type: string, maxLength: 4000 }
        howItWorks:
          {
            type: array,
            minItems: 0,
            maxItems: 8,
            items: { $ref: '#/components/schemas/HowItWorksStep' }
          }
    FaqEntry:
      type: object
      required: [ id, question, answer, sortOrder ]
      properties:
        id: { type: string }
        question: { type: string, maxLength: 200 }
        answer: { type: string, maxLength: 2000 }
        sortOrder: { type: integer }

    PublicConfig:
      type: object
      description: Public settings, including an explicitly owner-approved recovery
        email. Private recipient/sender addresses are never inferred or exposed
        through this schema.
      required: [ shootLocations, referralSources, timezone, publicContactEmail ]
      properties:
        shootLocations: { type: array, items: { type: string } }
        referralSources: { type: array, items: { type: string } }
        timezone: { type: string }
        publicContactEmail:
          {
            type: string,
            format: email,
            minLength: 1,
            maxLength: 254,
            description: 'Required public business contact address for manual inquiry
              recovery; separately owner-approved. Local example.invalid
              fixtures are not valid launch configuration.'
          }
    SiteConfig:
      allOf:
        - $ref: '#/components/schemas/PublicConfig'
        - type: object
          required: [ inquiryRecipient, senderAddress ]
          properties:
            inquiryRecipient: { type: string, format: email }
            senderAddress:
              {
                type: string,
                format: email,
                description: 'Must match the Gmail primary identity or an accepted verified
                  send-as alias. Server lookup requires gmail.settings.basic in
                  addition to gmail.send; failed verification leaves the entire
                  configuration unchanged.'
              }

    InquirySubmission:
      type: object
      required: [ firstName, lastName, email, contactMethod, shootType, turnstileToken ]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        phone:
          {
            type: string,
            minLength: 7,
            maxLength: 20,
            description: 'required when contactMethod is call or text'
          }
        contactMethod: { type: string, enum: [ email, call, text ] }
        postalCode: { type: string, minLength: 3, maxLength: 12 }
        shootType: { $ref: '#/components/schemas/ShootType' }
        preferredDay:
          {
            type: string,
            format: date,
            description: 'today..today+18 months in site timezone'
          }
        specialRequests: { type: string, maxLength: 2000 }
        sessionLengthHours: { type: integer, minimum: 1, maximum: 4 }
        numberOfPeople: { type: integer, minimum: 1, maximum: 12 }
        shootLocation: { type: string, description: 'must be a current configured option' }
        referralSource: { type: string, description: 'must be a current configured option' }
        message: { type: string, maxLength: 2000 }
        turnstileToken: { type: string }

    Session:
      type: object
      required: [ email, expiresAt ]
      properties:
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }

    Client:
      type: object
      required:
        [
          id,
          firstName,
          lastName,
          email,
          phone,
          shootType,
          sessionDate,
          notes,
          createdAt
        ]
      properties:
        id: { type: string }
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        phone: { type: [ string, 'null' ] }
        shootType: { $ref: '#/components/schemas/ShootType' }
        sessionDate: { type: [ string, 'null' ], format: date }
        notes: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [ firstName, lastName, email, shootType ]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        phone: { type: [ string, 'null' ] }
        shootType: { $ref: '#/components/schemas/ShootType' }
        sessionDate: { type: [ string, 'null' ], format: date }
        notes: { type: string, maxLength: 4000 }
    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          required: [ emails, checklist, questionnaires ]
          properties:
            emails: { type: array, items: { $ref: '#/components/schemas/ClientEmail' } }
            checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistState' } }
            questionnaires: { type: array, items: { $ref: '#/components/schemas/QuestionnaireInvite' } }
    ClientEmail:
      type: object
      description: Accepted-send history with every questionnaire link omitted; never
        returns raw invitation tokens or token-bearing MIME.
      required: [ id, templateId, questionnaireInviteId, subject, body, sentAt ]
      properties:
        id: { type: string }
        templateId: { type: [ string, 'null' ] }
        questionnaireInviteId:
          {
            type: [ string, 'null' ],
            description: 'Same-client invitation associated with this send; null for
              ordinary email. Owner UI uses this ID to open authenticated
              invitation detail, never a public token URL.'
          }
        subject:
          {
            type: string,
            description: 'Rendered subject with every questionnaire link replaced by
              [questionnaire link omitted].'
          }
        body:
          {
            type: string,
            description: 'Rendered body with every questionnaire link replaced by
              [questionnaire link omitted].'
          }
        sentAt: { type: string, format: date-time }
    SendEmailInput:
      type: object
      description: Literal application questionnaire URLs are rejected with 400 and a
        field error; use the questionnaireLink placeholder. Server expansion
        creates one new invitation for the selected client and occurs only in
        transient dispatch content.
      required: [ subject, body ]
      properties:
        templateId:
          {
            type: string,
            description: 'Recorded for history; questionnaireLink placeholders are resolved
              server-side in subject/body, with only redacted content retained.'
          }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }

    EmailTemplate:
      type: object
      description: Subject/body may contain approved placeholders, including
        questionnaireLink, but must reject literal application questionnaire
        URLs before persistence.
      required: [ id, name, subject, body, sortOrder ]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        sortOrder: { type: integer }
    ChecklistItem:
      type: object
      required: [ id, label, sortOrder ]
      properties:
        id: { type: string }
        label: { type: string, maxLength: 120 }
        sortOrder: { type: integer }
    ChecklistState:
      type: object
      required: [ itemId, label, completedAt ]
      properties:
        itemId: { type: string }
        label: { type: string }
        completedAt: { type: [ string, 'null' ], format: date-time }
    Question:
      type: object
      required: [ id, prompt, kind, options, required, sortOrder ]
      properties:
        id: { type: string }
        prompt: { type: string, maxLength: 300 }
        kind: { type: string, enum: [ short_text, long_text, single_choice ] }
        options:
          {
            type: [ array, 'null' ],
            items: { type: string },
            minItems: 2,
            maxItems: 10
          }
        required: { type: boolean }
        sortOrder: { type: integer }
    QuestionnaireInvite:
      type: object
      required: [ id, sentAt, expiresAt, submittedAt, status, questionsSnapshot, answers ]
      properties:
        id: { type: string }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        submittedAt: { type: [ string, 'null' ], format: date-time }
        status: { type: string, enum: [ pending, submitted, expired ] }
        questionsSnapshot:
          type: array
          description: 'Immutable questions captured when this invitation was sent; render
            owner history from these IDs, prompts, types, choices, required
            flags and sortOrder, never from the current master. Included in
            owner-authorized invitation responses only.'
          items: { $ref: '#/components/schemas/Question' }
        answers:
          type: [ object, 'null' ]
          description: 'Null before submission; otherwise values keyed by question ID from
            questionsSnapshot. Historical answer labels and choices come from
            that same snapshot.'
          additionalProperties: true
    QuestionnairePublic:
      type: object
      required: [ clientFirstName, questions, status ]
      properties:
        clientFirstName: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        status: { type: string, enum: [ pending, submitted, expired ] }

    OrderInput:
      type: object
      required: [ ids ]
      properties:
        ids:
          {
            type: array,
            items: { type: string },
            description: 'complete ordered list of ids'
          }

paths:
  # ───────────── Public ─────────────
  /public/bootstrap:
    get:
      tags: [ public ]
      summary: Everything a public page needs in one call
      responses:
        '200':
          {
            "description": "OK (edge-cacheable 60 s)",
            "content":
              {
                "application/json":
                  {
                    "schema":
                      {
                        "type": "object",
                        "required": [ "banner", "config", "gallery", "pages", "faq", "pricing" ],
                        "properties":
                          {
                            "banner": { "oneOf": [ { "$ref": "#/components/schemas/Banner" }, { "type": "null" } ] },
                            "config": { "$ref": "#/components/schemas/PublicConfig" },
                            "gallery": { "type": "array", "items": { "$ref": "#/components/schemas/GalleryImage" } },
                            "pages": { "type": "array", "items": { "$ref": "#/components/schemas/PageContent" } },
                            "faq": { "type": "array", "items": { "$ref": "#/components/schemas/FaqEntry" } },
                            "pricing": { "$ref": "#/components/schemas/PricingRevision" }
                          }
                      }
                  }
              }
          }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
  /pricing:
    get:
      tags: [ public ]
      summary: Current published pricing revision (source for sections, print, PDF)
      responses:
        '200':
          {
            "description": "OK",
            "content":
              {
                "application/json": { "schema": { "$ref": "#/components/schemas/PricingRevision" } }
              }
          }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
  /images/{id}/{variant}:
    get:
      tags: [ public ]
      summary: Serve an image variant from R2 (immutable cache)
      parameters:
        - $ref: '#/components/parameters/id'
        - {
            name: variant,
            in: path,
            required: true,
            schema: { type: string, enum: [ full, card, thumb ] }
          }
      responses:
        '200': { "description": "image/webp" }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '404': { "$ref": "#/components/responses/NotFound" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"

  # ───────────── Inquiry ─────────────
  /inquiries:
    post:
      tags: [ inquiry ]
      summary: Submit contact-form inquiry (CAPTCHA → validate → dedupe → Gmail send)
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/InquirySubmission' } }
          }
      responses:
        '202':
          {
            "description": "Email accepted by Gmail API. NOT a booking confirmation.",
            "content":
              {
                "application/json":
                  {
                    "schema":
                      {
                        "type": "object",
                        "required": [ "status" ],
                        "properties": { "status": { "const": "sent" } }
                      }
                  }
              }
          }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '409': { "$ref": "#/components/responses/Conflict" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        '502': { "$ref": "#/components/responses/EmailNotSent" }
        '504': { "$ref": "#/components/responses/EmailOutcomeUnknown" }
        "503":
          $ref: "#/components/responses/Maintenance"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  # ───────────── Auth ─────────────
  /auth/google/start:
    get:
      tags: [ auth ]
      summary: Begin Google OIDC (PKCE) — 302 to Google
      responses:
        '302': { "description": "redirect" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
  /auth/google/callback:
    get:
      tags: [ auth ]
      summary: Google redirect target; validates ID token + allow-list; 302 to SPA
        /admin/callback#code=…
      description: Consumes browser-bound OAuth state and stores only a hashed
        60-second exchange grant for the verified owner identity. Creates no
        session or bearer token. Raw codes must not enter logs or response
        caches.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          {
            "description": "redirect to SPA with one-time exchange code, or to /admin/denied"
          }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        '502': { "$ref": "#/components/responses/BadGateway" }
        "503":
          $ref: "#/components/responses/Maintenance"
  /auth/exchange:
    post:
      tags: [ auth ]
      summary: Atomically redeem a one-time identity grant and create a bearer session
      description: |
        Recheck the owner allow-list. Atomically consume exactly one unexpired grant and
        insert a session containing only a newly generated bearer-token hash. Return the
        raw bearer once, after commit, with Cache-Control no-store. Concurrent redemption
        has one winner. Invalid/expired/used codes return 400; removed owners return 403
        and their grant is invalidated. Transaction failure leaves no session and preserves
        the grant. After a lost response the SPA starts a fresh Google sign-in, not a replay
        or token-recovery request. Raw codes/bearers are excluded from logs and backups.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { type: object, required: [ code ], properties: { code: { type: string } } }
                }
            }
        }
      responses:
        '200':
          description: New session committed; raw bearer returned once.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'no-store' }
          content:
            application/json:
              schema:
                type: object
                required: [ token, session ]
                properties:
                  token: { type: string }
                  session: { $ref: '#/components/schemas/Session' }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '403': { "$ref": "#/components/responses/Forbidden" }
        '429': { "$ref": "#/components/responses/TooManyRequests" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /auth/session:
    get:
      tags: [ auth ]
      security: [ { ownerSession: [] } ]
      summary: Current session (also extends sliding expiry)
      responses:
        '200':
          {
            "description": "OK",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Session" } } }
          }
        '401': { "$ref": "#/components/responses/Unauthorized" }
        '403': { "$ref": "#/components/responses/Forbidden" }
        '500': { "$ref": "#/components/responses/InternalError" }
        "503":
          $ref: "#/components/responses/Maintenance"
  /auth/logout:
    post:
      tags: [ auth ]
      security: [ { ownerSession: [] } ]
      responses:
        '204': { "description": "session deleted" }
        '401': { "$ref": "#/components/responses/Unauthorized" }
        '403': { "$ref": "#/components/responses/Forbidden" }
